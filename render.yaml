
services:
  - type: web
    name: fileflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: FILEFLOW_DATA_DIR
        value: /tmp/fileflow-storage
